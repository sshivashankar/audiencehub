version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: audiencehub-postgres
    environment:
      POSTGRES_DB: audiencehub
      POSTGRES_USER: audiencehub
      POSTGRES_PASSWORD: audiencehub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audiencehub']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: audiencehub-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: audiencehub-api
    environment:
      DATABASE_URL: postgresql://audiencehub:audiencehub@postgres:5432/audiencehub
      DIRECT_URL: postgresql://audiencehub:audiencehub@postgres:5432/audiencehub
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: dev-secret-key
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    command: pnpm --filter @audiencehub/api start:dev

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: audiencehub-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXT_PUBLIC_APP_NAME: AudienceHub
    ports:
      - '3000:3000'
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages
    command: pnpm --filter @audiencehub/web dev

  projector:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.projector
    container_name: audiencehub-projector
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXT_PUBLIC_APP_NAME: AudienceHub
    ports:
      - '3002:3002'
    depends_on:
      - api
    volumes:
      - ./apps/projector/src:/app/apps/projector/src
      - ./packages:/app/packages
    command: pnpm --filter @audiencehub/projector dev

  nginx:
    image: nginx:alpine
    container_name: audiencehub-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - projector
    command: nginx -g "daemon off;"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: audiencehub-network
